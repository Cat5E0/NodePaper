# Manual release-candidate build (PLAN.md M4-01 decision 2: CI only, no CD).
#
# This workflow compiles the Windows x64 nodepaper.exe from the pushed commit,
# assembles the versioned ZIP and uploads it as a workflow artifact. It never
# auto-publishes a GitHub Release.
#
# The maintainer downloads the exact artifact and runs the same SHA-256 ZIP
# through the platform matrix (Windows 11 + TeX Live, independent MiKTeX,
# Windows 10), the PDF manual review and the release checklist, then creates
# the GitHub Release draft manually. `scripts/test-release.ps1` is the
# mechanical validation entry for that exact ZIP.
#
# Deliberately not triggered by pushing a tag. Two reasons, in order:
#
#   1. One version means one build. Building here as well as locally would put
#      two artifacts with different hashes behind the same version number,
#      which is the failure DESIGN.md's "version number and build identity"
#      section exists to prevent -- rc.9 once labelled two different builds.
#      The artifact the maintainer verified is the artifact that ships.
#   2. It could not have worked anyway. On a tag push actions/checkout force
#      fetches the resolved commit into refs/tags/<tag>, replacing the
#      annotated tag object with a lightweight ref, so the `git cat-file -t`
#      check that Assert-NodePaperBuildIdentity requires for every public
#      stage sees "commit" instead of "tag". v0.1.0-beta.1 was the repository's
#      first tag ever, so the run it triggered was also the first to expose
#      this; it failed without producing an artifact and without touching the
#      release, which had been built and verified locally from the real
#      annotated tag.

name: release-build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Full version, e.g. 0.1.0-dev.184+g17bdb9e, 0.1.0-beta.1, 0.1.0-rc.1, or 0.1.0"
        required: true
        type: string
      feature_freeze:
        description: "Required for an RC build"
        required: false
        default: false
        type: boolean
      no_release_blockers:
        description: "Required for an RC build"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build release ZIP
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: nodepaper/core/go.sum
      - name: Bootstrap pinned Pandoc tools
        run: .\scripts\dev\Bootstrap-Tools.ps1
      - name: Test version lifecycle rules
        shell: pwsh
        run: .\scripts\test-version-lifecycle.ps1
      - name: Resolve build version and policy flags
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) { $version = "${{ github.ref_name }}" -replace '^v', '' }
          if (-not $version) { throw "No build version provided." }
          $featureFreeze = "${{ github.event.inputs.feature_freeze }}"
          $noReleaseBlockers = "${{ github.event.inputs.no_release_blockers }}"
          if ("${{ github.ref_type }}" -eq "tag" -and $version -match '-rc\.') {
            $featureFreeze = "true"
            $noReleaseBlockers = "true"
          }
          "NODEPAPER_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NODEPAPER_FEATURE_FREEZE=$featureFreeze" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NODEPAPER_NO_RELEASE_BLOCKERS=$noReleaseBlockers" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build portable ZIP
        shell: pwsh
        run: |
          $policy = @{}
          if ($env:NODEPAPER_FEATURE_FREEZE -eq "true") { $policy.FeatureFreeze = $true }
          if ($env:NODEPAPER_NO_RELEASE_BLOCKERS -eq "true") { $policy.NoReleaseBlockers = $true }
          .\scripts\build-release.ps1 -Version $env:NODEPAPER_VERSION -Commit $env:GITHUB_SHA -OutputDirectory .\dist-release @policy
      - name: Bootstrap pinned Inno Setup
        shell: pwsh
        run: .\scripts\bootstrap-innosetup.ps1
      - name: Build Setup from the same payload
        shell: pwsh
        run: |
          $payloads = @(Get-ChildItem .\dist-release -Directory -Filter "nodepaper-*-windows-x64")
          if ($payloads.Count -ne 1) { throw "Expected exactly one release payload directory." }
          $policy = @{}
          if ($env:NODEPAPER_FEATURE_FREEZE -eq "true") { $policy.FeatureFreeze = $true }
          if ($env:NODEPAPER_NO_RELEASE_BLOCKERS -eq "true") { $policy.NoReleaseBlockers = $true }
          .\scripts\build-setup.ps1 -Version $env:NODEPAPER_VERSION -PayloadDirectory $payloads[0].FullName -OutputDirectory .\dist-release @policy
      - name: Build independent real-world corpus ZIPs
        shell: pwsh
        run: |
          $policy = @{}
          if ($env:NODEPAPER_FEATURE_FREEZE -eq "true") { $policy.FeatureFreeze = $true }
          if ($env:NODEPAPER_NO_RELEASE_BLOCKERS -eq "true") { $policy.NoReleaseBlockers = $true }
          .\scripts\build-test-corpus.ps1 -Version $env:NODEPAPER_VERSION -Commit $env:GITHUB_SHA -OutputDirectory .\dist-corpus @policy
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodepaper-build-${{ github.run_number }}
          path: |
            dist-release/*.zip
            dist-release/*.exe
            dist-release/release-manifest*.json
            dist-corpus/*.zip
          if-no-files-found: error
