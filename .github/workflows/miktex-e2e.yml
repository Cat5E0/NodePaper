# Non-blocking MiKTeX real-build E2E (PLAN.md M4-01 CI architecture decision).
#
# This workflow installs MiKTeX on the GitHub Windows runner and runs the
# full Pandoc/LaTeX E2E suite. The runner environment differs from the
# canonical release gate (Windows 11/10 + TeX Live / MiKTeX with auto-install
# off), so this is purely a compatibility smoke test.
#
# It does carry one check nothing else can: the runner ships SimSun but not
# SimHei or KaiTi, which is exactly the case M4-08's font fallback exists for.
# Developer and release machines have the supplemental fonts installed, so this
# is the only environment where the fallback is ever executed.
#
# An earlier revision tried to sidestep the missing fonts by writing a
# ctexopts.cfg that forced fontset=fandol. It never took effect -- the failing
# logs still show ctex-fontset-windows.def -- and it contradicted M4-08, which
# rejected Fandol after verifying it drops characters outright (劼 U+52BC and
# 黃 U+9EC3 vanish from a real paper). It has been removed rather than fixed.
#
# Triggered manually only. Not a required check — the
# authoritative E2E results are always the local Windows 11 + TeX Live 2025
# and independent MiKTeX runs recorded at release time.

name: miktex-e2e

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: MiKTeX real E2E
    runs-on: windows-latest
    env:
      # The runner MiKTeX lacks some packages; CI may fetch them. The formal
      # release gate (auto-install off) is exercised separately on MiKTeX.
      MIKTEX_AUTOINSTALL: "yes"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: Bootstrap pinned Pandoc tools
        run: .\Bootstrap-Tools.ps1
      - name: Install Poppler utilities
        run: choco install poppler -y --no-progress
      - name: Install MiKTeX (not present on this runner image)
        run: choco install miktex -y --no-progress
      - name: Locate MiKTeX bin, configure auto-install, add to PATH
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files\MiKTeX\miktex\bin\x64",
            "C:\Program Files (x86)\MiKTeX\miktex\bin\x64",
            "$env:LOCALAPPDATA\Programs\MiKTeX\miktex\bin\x64",
            "$env:APPDATA\MiKTeX\miktex\bin\x64"
          )
          $miktexBin = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $miktexBin) {
            foreach ($root in @("C:\Program Files", "C:\Program Files (x86)", "$env:LOCALAPPDATA\Programs")) {
              if (-not (Test-Path -LiteralPath $root)) { continue }
              $miktexBin = Get-ChildItem -LiteralPath $root -Directory -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -eq "x64" -and (Test-Path -LiteralPath (Join-Path $_.FullName "latexmk.exe")) } |
                Select-Object -First 1 -ExpandProperty FullName
              if ($miktexBin) { break }
            }
          }
          if (-not $miktexBin) {
            throw "MiKTeX bin directory was not found after installation."
          }
          Write-Host "Using MiKTeX bin: $miktexBin"
          & (Join-Path $miktexBin "initexmf.exe") --set-config-value "[MPM]AutoInstall=1" 2>&1 | Out-String | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "initexmf configuration failed" }
          # The runner shell is elevated ("xelatex: security risk: running with
          # elevated privileges"), and an elevated MiKTeX reads the system-wide
          # configuration, where the setting above -- written per user -- does
          # not apply. Auto-install fired on run 31991013261 and then not on
          # 31993318613 or 31993685955; setting both scopes removes one
          # explanation for that. It stays a backstop either way, since the
          # packages this suite needs are installed explicitly below.
          & (Join-Path $miktexBin "initexmf.exe") --admin --set-config-value "[MPM]AutoInstall=1" 2>&1 | Out-String | Write-Host
          if ($LASTEXITCODE -ne 0) { Write-Host "note: could not set AutoInstall for the system scope (exit $LASTEXITCODE)" }
          & (Join-Path $miktexBin "miktex.exe") packages update-package-database 2>&1 | Out-String | Write-Host
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $miktexBin
      - name: Install ctex explicitly rather than relying on auto-install
        shell: pwsh
        run: |
          # MIKTEX_AUTOINSTALL fetches packages mid-compile, and it is not
          # reliable: run 31991013261 auto-installed ctex and the probe passed,
          # while 31993318613 -- same workflow, same runner image -- got
          # "! LaTeX Error: File `ctexart.cls' not found." Flakiness in the
          # environment is indistinguishable from a NodePaper regression when
          # reading a red run, so the packages this suite needs are installed
          # up front and auto-install is left only as a backstop.
          # `miktex packages install ctex` does not pull dependencies, so the
          # chain is listed out. Names are installed one at a time and a
          # failure is only reported: MiKTeX package names drift between
          # releases, and one renamed entry should not mask the outcome that
          # actually matters, which is whether the files resolve.
          foreach ($p in @("ctex", "xecjk", "zhnumber", "fandol", "realscripts", "fontspec", "l3packages", "l3kernel", "xcolor")) {
            & miktex packages install $p 2>&1 | Out-String | Write-Host
            if ($LASTEXITCODE -ne 0) { Write-Host "note: could not install $p (exit $LASTEXITCODE)" }
          }
          $missing = @()
          foreach ($f in @("ctexart.cls", "xeCJK.sty", "zhnumber.sty", "fontspec.sty")) {
            & kpsewhich $f 2>&1 | Out-String | Write-Host
            if ($LASTEXITCODE -ne 0) { $missing += $f }
          }
          if ($missing) { throw "still unresolvable after installation: $($missing -join ', ')" }
      - name: Report how MiKTeX identifies its xelatex
        shell: pwsh
        run: |
          # doctor scans this output for a line identifying XeTeX. TeX Live
          # prints "XeTeX 3.14... (TeX Live 2025)"; MiKTeX prints something
          # else, which made doctor fail with NP402 "cannot identify
          # xelatex.exe version output" on 2026-08-17. Printing it verbatim
          # keeps the matcher honest instead of guessing at the format.
          Write-Host "===== xelatex --version ====="
          & xelatex --version 2>&1 | Select-Object -First 6
      - name: Report which Chinese fonts this runner has
        shell: pwsh
        run: |
          # M4-08's fallback keys off exactly these files, so record what the
          # runner actually has before anything compiles. This is the one
          # environment that exercises the fallback: developer machines have
          # the supplemental fonts and therefore never reach it.
          foreach ($f in @("simsun.ttc", "simhei.ttf", "simkai.ttf")) {
            $found = @(
              (Join-Path $env:WINDIR "Fonts\$f"),
              (Join-Path $env:LOCALAPPDATA "Microsoft\Windows\Fonts\$f")
            ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
            if ($found) { Write-Host "$f -> $found" } else { Write-Host "$f -> not on this runner" }
          }
      - name: Chinese probe using NodePaper's own font fallback
        shell: pwsh
        run: |
          # The probe must compile the way NodePaper does, not the way a bare
          # ctexart document does. A bare \documentclass{ctexart} takes ctex's
          # fontset=windows path and demands SimHei, which this runner does not
          # have -- it failed here for that reason on 2026-08-07, 08-09 and
          # 08-17, and none of those failures said anything about NodePaper.
          #
          # The preamble below mirrors the fallback in
          # profiles/cumcm/template.tex: when NodePaper's probe finds SimHei or
          # KaiTi absent it emits fontset=none and synthesises the weights from
          # SimSun. Compiling that here checks the strategy on the one platform
          # that can check it. A failure now is a real NodePaper defect.
          $probeDir = Join-Path $env:RUNNER_TEMP ("miktex-probe-" + [Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path $probeDir | Out-Null
          # Written as an indented array rather than a here-string: a YAML
          # block scalar ends at the first line indented less than the block,
          # and a PowerShell here-string must close with '@ in column 1, so the
          # two cannot coexist. Single quotes keep every backslash literal.
          $probeLines = @(
            '\documentclass[UTF8,zihao=-4,a4paper,fontset=none]{ctexart}',
            '\setCJKmainfont{SimSun}[AutoFakeBold=true, AutoFakeSlant=true]',
            '\setCJKfamilyfont{zhsong}{SimSun}[AutoFakeBold=true, AutoFakeSlant=true]',
            '\setCJKfamilyfont{zhhei}{SimSun}[AutoFakeBold=true]',
            '\setCJKfamilyfont{zhkai}{SimSun}[AutoFakeSlant=true]',
            '\setCJKfamilyfont{zhfs}{SimSun}',
            '\providecommand{\songti}{\CJKfamily{zhsong}}',
            '\providecommand{\heiti}{\CJKfamily{zhhei}}',
            '\providecommand{\kaishu}{\CJKfamily{zhkai}}',
            '\providecommand{\fangsong}{\CJKfamily{zhfs}}',
            '\begin{document}',
            'NodePaper 中文环境探针：宋体 {\heiti 黑体} {\kaishu 楷书} \textbf{粗体} \emph{斜体}',
            '\end{document}'
          )
          Set-Content -LiteralPath (Join-Path $probeDir "probe.tex") -Value $probeLines -Encoding UTF8
          & latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error "-outdir=$probeDir" (Join-Path $probeDir "probe.tex")
          $probeExit = $LASTEXITCODE
          Write-Host "probe exit: $probeExit"
          $log = Join-Path $probeDir "probe.log"
          if (Test-Path -LiteralPath $log) {
            Write-Host "===== probe.log tail ====="
            Get-Content -LiteralPath $log -Tail 40
          }
          exit $probeExit
      - name: M3 E2E suite
        run: .\scripts\test-e2e.ps1
