# Required CI for NodePaper (AGENTS.md section 29, PLAN.md M4-01).
#
# Fast checks: gofmt, vet, unit, fake-tool integration, race detector and
# govulncheck on the GitHub Windows runner (which ships a C toolchain, so the
# race detector runs here even though the local dev machine cannot).
#
# This is the sole GitHub required check. Required checks must not be made
# green by relaxing Warning rules, auto accepting Golden files or skipping
# failing tests.
#
# Real Pandoc/LaTeX E2E on a MiKTeX runner lives in the separate
# non-blocking `miktex-e2e.yml` (workflow_dispatch).

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fast:
    name: Fast checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Fixed stdlib vulnerabilities (GO-2026-4970, GO-2026-5856);
          # govulncheck must report zero reachable findings on this version.
          go-version: "1.26.5"
          cache: true
      - name: gofmt
        shell: pwsh
        run: |
          $files = & gofmt -l cmd internal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($files) {
            Write-Error "Go files are not formatted:`n$($files -join [Environment]::NewLine)"
            exit 1
          }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 ./...
      - name: Fake-tool integration (JSON, paths, locks, cancellation)
        run: go test -count=1 ./internal/validate ./internal/buildlock ./internal/process ./internal/build ./cmd/nodepaper
      - name: Race detector
        run: go test -race -count=1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...


