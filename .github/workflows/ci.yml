# Required CI for NodePaper (AGENTS.md section 29, PLAN.md M4-01).
#
# Separate jobs so the GitHub Actions UI shows each check's pass/fail status
# at a glance. Jobs run sequentially (`needs`) to stay within the private-repo
# Windows runner concurrency limit.
#
# This is the sole GitHub required check group. Required checks must not be
# made green by relaxing Warning rules, auto accepting Golden files or
# skipping failing tests.
#
# Real Pandoc/LaTeX E2E on a MiKTeX runner lives in the separate
# non-blocking `miktex-e2e.yml` (workflow_dispatch).

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gofmt:
    name: gofmt
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: gofmt
        shell: pwsh
        run: |
          $files = & gofmt -l cmd internal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($files) {
            Write-Error "Go files are not formatted:`n$($files -join [Environment]::NewLine)"
            exit 1
          }

  vet:
    name: go vet
    needs: gofmt
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: go vet
        run: go vet ./...

  test:
    name: go test
    needs: vet
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: go test (unit + integration)
        run: go test -count=1 ./...

  race:
    name: Race detector
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: go test -race
        run: go test -race -count=1 ./...

  govulncheck:
    name: govulncheck
    needs: race
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
