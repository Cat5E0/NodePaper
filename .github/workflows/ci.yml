# Required CI for NodePaper (AGENTS.md section 29, PLAN.md M4-01).
#
# Single job with individually-named steps — the private repo has limited
# Windows concurrency, and multi-job workflows cause runner queue stalls.
# Each step name is self-explanatory; failures are obvious in the job log.
#
# This is the sole GitHub required check. Required checks must not be made
# green by relaxing Warning rules, auto accepting Golden files or skipping
# failing tests.
#
# Real Pandoc/LaTeX E2E on a MiKTeX runner lives in the separate
# non-blocking `miktex-e2e.yml` (workflow_dispatch).

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: All checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - name: "1/5  gofmt"
        shell: pwsh
        run: |
          $files = & gofmt -l cmd internal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($files) {
            Write-Error "Go files are not formatted:`n$($files -join [Environment]::NewLine)"
            exit 1
          }

      - name: "2/5  go vet"
        run: go vet ./...

      - name: "3/5  go test (unit + integration)"
        run: go test -count=1 ./...

      - name: "4/5  Race detector"
        run: go test -race -count=1 ./...

      - name: "5/5  govulncheck"
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
